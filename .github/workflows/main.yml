name: Build LeanType Keyboard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          PROJECT=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(find . -type f -name gradlew \
                    -not -path '*/node_modules/*')

          if [ -z "$PROJECT" ]; then
            while IFS= read -r file; do
              dir="$(dirname "$file")"

              if [ -f "$dir/build.gradle" ] || \
                 [ -f "$dir/build.gradle.kts" ]; then
                PROJECT="$dir"
                break
              fi
            done < <(find . -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/node_modules/*')
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Your repository may contain a web app"
            echo "or an incomplete Android project."
            exit 1
          fi

          echo "Project directory: $PROJECT"
          echo "directory=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper missing."
            echo "Attempting to generate wrapper..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "ERROR: Gradle is not installed."
              exit 1
            fi

            gradle wrapper

            chmod +x gradlew
          fi

      - name: Build Android APK
        shell: bash
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanType-Keyboard-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
